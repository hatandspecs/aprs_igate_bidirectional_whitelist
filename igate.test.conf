# TEST CONFIG — forced digipeat path through W3YA-1. NOT for normal operation.
#
# Differs from igate.conf in exactly four settings:
#
#   DEPLOY_MODE = bare-metal   this file is for the Pi, not the laptop
#   TX_VIA      = W3YA-1       every transmission routed through that digipeater
#   RX_VIA      = W3YA-1       gate ONLY packets W3YA-1 actually repeated
#   BEACON_TO   = off          no beacons cluttering the test
#
# RX_VIA is why this must not be left running: while it is set, every packet
# that did not come through W3YA-1 goes ungated, which makes the station
# useless to the rest of the network.
#
# Run it WITHOUT touching igate.conf:
#
#   sudo systemctl stop aprs-igate
#   ./deploy_igate.sh config igate.test.conf
#   ./deploy_igate.sh up     igate.test.conf
#   ./deploy_igate.sh monitor
#
# And put production back:
#
#   ./deploy_igate.sh down igate.test.conf
#   sudo systemctl start aprs-igate
#
# ---------------------------------------------------------------------------

# APRS iGate configuration — plain key = value, no shell syntax.
# Edit these values, then run:  ./deploy_igate.sh config   (review/validate)
#                                ./deploy_igate.sh up       (deploy)
# Background on each setting is in aprs-igate-prototype-test.md.

# --- Deployment mode ---
# docker (default): runs direwolf + rigctld in the locked-down container.
# bare-metal: installs direwolf/hamlib on this host and runs them directly,
# no container. See README.md ("Docker mode vs. bare-metal mode").
DEPLOY_MODE = bare-metal

# --- Station identity (Section 7) ---
MYCALL = KD3CCO-10
MODEM = 1200

# --- Audio device (Section 5: `arecord -l`) ---
ACHANNELS = 1
ADEVICE = plughw:1,0

# --- Audio levels (ALSA mixer, re-applied on every `up`) ---
# These reset to device defaults whenever the radio's USB re-enumerates, and
# the defaults are WRONG in both directions: the default TX level over-
# deviates (signal is audible but undecodable) and the default capture gain
# is far too low to decode anything. Both fail silently, so `up` always
# re-applies these rather than trusting whatever survived.
#
# Calibrated 2026-09-07 against a Yaesu FTX-1 at 1 W: TX 10 produced a signal
# that W3YA-1 digipeated and KB3KPP-1 gated. TX 23 (the device default) and
# TX 33 both over-deviated and decoded nowhere.
TX_AUDIO_LEVEL = 10
RX_AUDIO_LEVEL = 35
DISABLE_AGC = yes

# --- Radio setup applied on every `up` (via CAT) ---
# Guards against the failure that cost hours during bring-up: in plain FM the
# FTX-1 modulates from the MIC input, not the USB codec, so Direwolf keys the
# radio and transmits a carrier with no data in it. PTT works, the waterfall
# shows a signal, and nothing anywhere can decode it. PKTFM is hamlib's name
# for the radio's FM-D (data FM) mode, verified: "M FM" -> FM, "M PKTFM" -> FM-D.
RADIO_SET_ON_UP = yes
RADIO_FREQ = 144390000
RADIO_MODE = PKTFM
RADIO_PASSBAND = 16000

# --- CAT / PTT (Section 8) ---
# The FTX-1 exposes CAT control and PTT as two separate serial ports over its
# single USB-C connection. Confirmed working via WSJT-X and the ftx1-tuner-sweep
# project: hamlib has no native FTX-1 model yet, but it CAT-controls cleanly
# as a Yaesu FT-991 (rigctl model 1035). See README.md for how this is wired.
RIG_MODEL = 1035          # hamlib model number; `rigctl --list` to find others
CAT_DEVICE = /dev/ttyUSB0 # CAT control port (frequency, mode, etc.)
CAT_BAUD = 38400
PTT_DEVICE = /dev/ttyACM0 # separate PTT port. Single-port radios: same as CAT_DEVICE
PTT_TYPE = RIG            # RIG = PTT via CAT command (hamlib's name for what
                           # WSJT-X calls the "CAT" PTT method). Other values:
                           # RTS, DTR, NONE — see README.md.

# --- Station beacon ---
# Off by default. A beacon is the only thing besides a whitelisted message that
# this station ever sends, so switching it on is a deliberate choice.
#
# BEACON_TO:
#   off   never beacon
#   IG    send to APRS-IS over the internet only — the station appears on
#         aprs.fi with a position, and NOTHING is transmitted on RF
#   RF    transmit on 144.390, so local stations see it on their radios; it
#         reaches aprs.fi only if a neighbouring iGate hears and gates it
#   BOTH  both of the above — local RF visibility plus guaranteed aprs.fi
#         presence. One extra packet per interval.
#
# 30:00 is a courteous interval for a fixed station on a shared national
# channel. Do not shorten it without a reason.
BEACON_TO = off        # off during the test, to keep the log clean
BEACON_EVERY = 30:00

# Position. Preferred form is a Maidenhead grid square: a 6-character locator is
# about 4 x 6 km, so it is rounded by construction rather than by remembering to
# round. The position goes into a permanent, public, worldwide database.
BEACON_GRID = FN10cs

# Alternative to BEACON_GRID: decimal degrees, south and west negative. Used
# only when BEACON_GRID is blank. ROUND THESE — pick a nearby intersection or
# the middle of the neighbourhood, not the house. Three decimals is ~100 m.
BEACON_LAT =
BEACON_LON =

# Overlay character on the APRS "&" gateway symbol, which tells other operators
# what kind of gate this is:
#   R  receive-only iGate          I  generic iGate
#   T  transmitting iGate (1 hop)  2  transmitting iGate (2 hops)
# R is the honest default for this project: the transmit path is whitelist-only,
# so from any other operator's point of view this gate receives and never
# relays to them. Advertising T or 2 invites someone to rely on delivery that
# will not happen.
BEACON_OVERLAY = R

# Keep it accurate about what the gate will and will not do for others.
BEACON_COMMENT = RX iGate | TX whitelist only

# --- Local control ports ---
# Direwolf can listen for AGW clients (Xastir, APRSIS32) and KISS TCP clients
# (kissutil), and it binds both to 0.0.0.0 with no authentication. Anything
# that can reach the KISS port can transmit arbitrary packets under MYCALL.
# Direwolf offers no bind-address setting, so 0 (off) is the only way to make
# them unreachable.
#
# Docker mode hid this by publishing no ports. Bare-metal mode does not, which
# matters most on a headless Pi sitting on a shared WiFi network.
#
# Set KISS_PORT = 8001 temporarily when injecting test packets with kissutil,
# then set it back to 0.
AGW_PORT = 0
KISS_PORT = 0

# --- Container egress restriction ---
# yes = the container is placed on its own docker network and filtered in the
#       iptables DOCKER-USER chain so it can reach only DNS and the APRS-IS
#       port. Requires sudo; if sudo is unavailable `up` warns and continues
#       with unrestricted egress rather than failing.
# no  = default docker bridge, unrestricted outbound.
RESTRICT_EGRESS = yes
IGSERVER_PORT = 14580

# --- APRS-IS server login ---
# See README.md ("APRS-IS and your passcode") for what this network is and
# how to get your passcode. Leave IGLOGIN_PASSCODE blank here — put the real
# value in igate.secrets (gitignored) or the IGATE_PASSCODE env var instead
# of committing it in this file.
IGSERVER = noam.aprs2.net
IGLOGIN_CALL = KD3CCO
IGLOGIN_PASSCODE =

# --- Strict whitelist (Section 4) ---
# Comma-separated calls. Only Internet->RF *messages* addressed to one of
# these will ever be transmitted — everything else (positions, telemetry,
# messages to anyone else) is silently dropped. Wildcard (*) covers all
# SSIDs of a call, so "KD3CCO*" matches KD3CCO, KD3CCO-7, KD3CCO-10, etc.
#
# One call:            WHITELIST_CALLS = KD3CCO*
# Multiple calls:       WHITELIST_CALLS = KD3CCO*, W3XYZ*, N0CALL-9
WHITELIST_CALLS = KD3CCO*

# --- Forced digipeat path (Section 7/12) ---
# Applied to everything this station transmits: gated messages and the RF
# beacon alike. Blank = direct, no digipeater (the bench setting).
#
# Naming a digipeater explicitly is deterministic: a digipeater repeats any
# packet carrying its own callsign in the path, whatever WIDEn-N aliases it
# answers to. The generic form depends on that digi's alias configuration —
# W3YA-1 answers WIDE2, not WIDE1, so "WIDE1-1" would not reach it.
#
#   TX_VIA =                  direct, no digipeater
#   TX_VIA = W3YA-1           force every transmission through that digipeater
#   TX_VIA = WIDE2-1          generic single hop via whatever answers WIDE2
#   TX_VIA = W3YA-1,WIDE2-1   that digi first, then one more generic hop
TX_VIA = W3YA-1

# --- Restrict what gets gated UP (test knob) ---
# Blank = gate everything heard, which is the useful behaviour for the network.
# Set to one or more digipeater callsigns to gate ONLY packets that were
# actually repeated by them — Direwolf checks the AX.25 has-been-used bit, so
# this means genuinely relayed by that station, not merely addressed to it.
#
# This deliberately makes the station less useful to everyone else, so it
# belongs in a test and should go back to blank afterwards.
#
#   RX_VIA =                  gate everything (normal operation)
#   RX_VIA = W3YA-1           gate only what W3YA-1 repeated
RX_VIA = W3YA-1

# Rate cap: max N packets in M seconds
IGTXLIMIT = 6 10
