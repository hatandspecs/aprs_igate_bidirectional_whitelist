# ALSA capture route for the FTX-1's built-in C-Media codec (0d8c:0016).
#
# That codec presents a TWO channel capture endpoint, but the radio feeds
# audio on the left channel only. Measured 2026-11-26 over a 10 s recording:
#
#   ch0 (left)   peak -16.8 dBFS   rms -31.1 dBFS
#   ch1 (right)  peak -65.7 dBFS   rms -80.1 dBFS   (silent)
#
# "plughw:1,0" opened as mono converts stereo to mono by AVERAGING, so the
# live channel is halved by the dead one and 6.5 dB is thrown away before
# Direwolf sees anything:
#
#   stereo ch0 alone        peak -17.8 dBFS
#   plughw mono (averaged)  peak -24.3 dBFS
#   route_policy copy       peak -16.6 dBFS
#
# route_policy "copy" takes the first channel instead of mixing.
#
# This does NOT apply to the Pi. The Digirig's codec (0d8c:0012) presents a
# ONE channel capture endpoint, so plughw has nothing to average and
# KD3CCO-10 loses nothing. Checked with /proc/asound/card*/stream0; do that
# before assuming a new interface needs this file.

pcm.ftx1left {
    type plug
    slave.pcm "hw:1,0"
    slave.channels 2
    route_policy copy
}
