# Raspberry Pi image build settings — plain key = value, no shell syntax.
# Credentials live in pi.secrets (gitignored); see pi.secrets.example.
#
# Build an SD card image with:  ./build_pi_image.sh build

# --- Target hardware ---
# The Pi 3A+ has 512 MB RAM and a single USB-A port. The 32-bit (armhf) Lite
# image is the safer choice at that memory size; arm64 works but leaves less
# headroom. Set to arm64 only if there is a reason to.
PI_IMAGE_VARIANT = armhf

# Leave blank to download the current Raspberry Pi OS Lite image, or set an
# absolute path to a .img or .img.xz already on disk to skip the download.
PI_IMAGE_PATH =

# --- Identity and access ---
PI_HOSTNAME = aprs-igate
PI_USER = igate

# Optional: path to an SSH public key to install for PI_USER. Key-based login
# is preferable to a password over the air; password login still works either
# way. Leave blank for password-only — "./build_pi_image.sh check" lists the
# public keys available on this host.
PI_SSH_PUBKEY =

# --- Locale ---
# PI_WIFI_COUNTRY is required, not cosmetic: Raspberry Pi OS keeps the WiFi
# radio rfkill-blocked until a regulatory domain is set, so an unset or wrong
# country means the Pi never joins any network.
PI_WIFI_COUNTRY = US
PI_TIMEZONE = America/New_York
PI_KEYBOARD = us

# C.UTF-8 is compiled into glibc, so it needs no generation and exists from the
# first second of the first boot. Anything else (en_US.UTF-8, say) has to be
# compiled by locale-gen during first-boot setup, which means every shell warns
# "cannot change locale" until that finishes — cosmetic, but it shows up on the
# very first login. UTF-8 handling is identical; only collation differs (ASCII
# order), which nothing here depends on.
PI_LOCALE = C.UTF-8

# --- iGate deployment ---
# Where the project is installed on the Pi, under PI_USER's home.
PI_INSTALL_DIR = aprs-igate

# Start the iGate automatically at boot via systemd.
PI_AUTOSTART = yes

# The radio this Pi drives: a profile name from radios/ (ls radios/), written
# into the Pi's own igate.local.conf as RADIO. Blank uses RADIO from igate.conf,
# the station's usual radio. `check` rejects a name with no profile.
#   ftx1     Yaesu FTX-1 over USB (CAT and PTT)
#   digirig  Any radio on a Digirig Lite (no CAT; PTT on the Digirig). Named
#            for the interface because that is what the settings describe —
#            the VX-6R, the Radtel 880G and the FT-2900R all run on it
#            unchanged. The Radtel is the radio in service on the pi-gate;
#            see §15.4 of aprs-igate-prototype-test.md
PI_RADIO = digirig

# --- Logging ---
# The systemd journal, and whether it survives a reboot.
#
# yes  persistent, hard-capped at 32M. A reboot keeps the evidence of whatever
#      caused it. A few days of this station's logging, rotated by systemd, and
#      a rounding error against an SD card's endurance.
# no   volatile: kept in /run, nothing written to the card, erased by every
#      reboot — including the reboot you are trying to explain.
#
# This defaulted to `no` and was changed after it cost a definite answer: an
# investigation into USB resets could not establish whether the previous radio
# also caused them, because dmesg only reached back to the boot that preceded
# the new one.
PI_PERSISTENT_JOURNAL = yes

# --- Read-only LAN web monitor ---
# Serves one page on the local network showing live packet flow and the resolved
# whitelist, at http://<PI_HOSTNAME>.local:<PI_WEB_PORT>/
#
# Read-only by construction: no POST handler, nothing that can edit the
# whitelist, restart the gateway, or serve the raw log (which would publish the
# APRS-IS passcode). It is unauthenticated, so it is for a trusted LAN only —
# see "Web monitor" in README.md before exposing it any further.
PI_WEB_MONITOR = yes
PI_WEB_PORT = 8080

# --- UPS HAT: graceful shutdown on mains loss ---
#
# The battery is not the protection; the shutdown is. A UPS that keeps the Pi
# running and then dies mid-write corrupts the card exactly as a pulled plug
# does, so what closes NFR-15 is detecting the loss and powering off with
# charge still in hand.
#
# The HAT reports on the GPIO header, not over I2C: GPIO17 goes high on mains
# loss, GPIO27 carries a heartbeat the HAT toggles while it is alive, and
# GPIO18 is held low to mean "the Pi is running" — the kernel releasing it at
# power-off is what tells the HAT to cut its own output and come back when
# mains returns. None of those collide with this station, whose only GPIO use
# is CM108_GPIO, a pin inside the USB sound card rather than on the Pi.
#
# Enabling this without a HAT fitted is harmless: with no heartbeat on GPIO27
# the script refuses to act on GPIO17, because an unconnected input is a
# floating pin whose value means nothing.
PI_UPS = yes

# Seconds on battery before powering off. 30 rides out a flicker without taking
# the station down for an outage that did not happen, and leaves most of a
# cell unused at the moment of shutdown — the fitted one is marked 750 mAh /
# 2.775 Wh, and its actual runtime has not been measured. The
# vendor's own script ships with 60 and documents 5, which is too eager for an
# unattended station. Staying up longer buys nothing operationally: the radio
# is dark the moment mains goes, so the gateway is off the air either way and
# all that remains is to go down cleanly.
PI_UPS_SHUTDOWN_SECS = 30

# --- Real-time clock ---
#
# The chip on the GPIO header, as the i2c-rtc overlay names it. The UPS HAT
# above carries a DS3231; a bare module is the same part. Blank means no clock,
# which is the stock behaviour: the station comes up with the wrong time and
# stays wrong until NTP corrects it, and every packet it gates in between is
# timestamped from that wrong clock.
#
# ds3231 is correct here even though the kernel driver that binds to it is
# called rtc-ds1307. That is not a mistake and it has cost time before.
#
# Setting this makes the image enable i2c_arm, load the overlay, install
# i2c-tools and util-linux-extra, remove fake-hwclock, and write the clock once
# from NTP on first boot. Removing fake-hwclock matters: with a real clock
# fitted the two compete, and the stale saved timestamp can win.
PI_RTC = ds3231

# Size of the tmpfs mounted at run/. Everything there is regenerated on each
# start, so it lives in RAM rather than on the SD card: a card that is never
# written cannot be corrupted by pulling the plug. The packet log is rotated
# hourly at 8 MB keeping 2 generations, so this needs roughly 24 MB of headroom.
# Remember this comes out of 512 MB total.
PI_RUN_TMPFS_SIZE = 32M

# The Pi runs bare-metal, not Docker: 512 MB is too little to spend on a
# container runtime, and the gateway needs direct access to the radio's devices
# anyway. build_pi_image.sh writes DEPLOY_MODE = bare-metal into the Pi's own
# igate.local.conf, and installs igate.conf unchanged.
