# Raspberry Pi image build settings — plain key = value, no shell syntax.
# Credentials live in pi.secrets (gitignored); see pi.secrets.example.
#
# Build an SD card image with:  ./build_pi_image.sh build

# --- Target hardware ---
# The Pi 3A+ has 512 MB RAM and a single USB-A port. The 32-bit (armhf) Lite
# image is the safer choice at that memory size; arm64 works but leaves less
# headroom. Set to arm64 only if there is a reason to.
PI_IMAGE_VARIANT = armhf

# Leave blank to download the current Raspberry Pi OS Lite image, or set an
# absolute path to a .img or .img.xz already on disk to skip the download.
PI_IMAGE_PATH =

# --- Identity and access ---
PI_HOSTNAME = aprs-igate
PI_USER = igate

# Optional: path to an SSH public key to install for PI_USER. Key-based login
# is preferable to a password over the air; password login still works either
# way. Leave blank for password-only — "./build_pi_image.sh check" lists the
# public keys available on this host.
PI_SSH_PUBKEY =

# --- Locale ---
# PI_WIFI_COUNTRY is required, not cosmetic: Raspberry Pi OS keeps the WiFi
# radio rfkill-blocked until a regulatory domain is set, so an unset or wrong
# country means the Pi never joins any network.
PI_WIFI_COUNTRY = US
PI_TIMEZONE = America/New_York
PI_LOCALE = en_US.UTF-8
PI_KEYBOARD = us

# --- iGate deployment ---
# Where the project is installed on the Pi, under PI_USER's home.
PI_INSTALL_DIR = aprs-igate

# Start the iGate automatically at boot via systemd.
PI_AUTOSTART = yes

# The Pi runs bare-metal, not Docker: 512 MB is too little to spend on a
# container runtime, and the gateway needs direct access to the radio's serial
# and audio devices anyway. build_pi_image.sh writes DEPLOY_MODE = bare-metal
# into the config it installs, leaving this working copy untouched.
