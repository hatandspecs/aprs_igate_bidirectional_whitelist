# Raspberry Pi image build settings — plain key = value, no shell syntax.
# Credentials live in pi.secrets (gitignored); see pi.secrets.example.
#
# Build an SD card image with:  ./build_pi_image.sh build

# --- Target hardware ---
# The Pi 3A+ has 512 MB RAM and a single USB-A port. The 32-bit (armhf) Lite
# image is the safer choice at that memory size; arm64 works but leaves less
# headroom. Set to arm64 only if there is a reason to.
PI_IMAGE_VARIANT = armhf

# Leave blank to download the current Raspberry Pi OS Lite image, or set an
# absolute path to a .img or .img.xz already on disk to skip the download.
PI_IMAGE_PATH =

# --- Identity and access ---
PI_HOSTNAME = aprs-igate
PI_USER = igate

# Optional: path to an SSH public key to install for PI_USER. Key-based login
# is preferable to a password over the air; password login still works either
# way. Leave blank for password-only — "./build_pi_image.sh check" lists the
# public keys available on this host.
PI_SSH_PUBKEY =

# --- Locale ---
# PI_WIFI_COUNTRY is required, not cosmetic: Raspberry Pi OS keeps the WiFi
# radio rfkill-blocked until a regulatory domain is set, so an unset or wrong
# country means the Pi never joins any network.
PI_WIFI_COUNTRY = US
PI_TIMEZONE = America/New_York
PI_KEYBOARD = us

# C.UTF-8 is compiled into glibc, so it needs no generation and exists from the
# first second of the first boot. Anything else (en_US.UTF-8, say) has to be
# compiled by locale-gen during first-boot setup, which means every shell warns
# "cannot change locale" until that finishes — cosmetic, but it shows up on the
# very first login. UTF-8 handling is identical; only collation differs (ASCII
# order), which nothing here depends on.
PI_LOCALE = C.UTF-8

# --- iGate deployment ---
# Where the project is installed on the Pi, under PI_USER's home.
PI_INSTALL_DIR = aprs-igate

# Start the iGate automatically at boot via systemd.
PI_AUTOSTART = yes

# The radio this Pi drives: a profile name from radios/ (ls radios/), written
# into the Pi's own igate.local.conf as RADIO. Blank uses RADIO from igate.conf,
# the station's usual radio. `check` rejects a name with no profile.
#   ftx1   Yaesu FTX-1 over USB (CAT and PTT)
#   vx6r   Yaesu VX-6R on a Digirig Lite (no CAT; PTT on the Digirig)
PI_RADIO = vx6r

# --- Read-only LAN web monitor ---
# Serves one page on the local network showing live packet flow and the resolved
# whitelist, at http://<PI_HOSTNAME>.local:<PI_WEB_PORT>/
#
# Read-only by construction: no POST handler, nothing that can edit the
# whitelist, restart the gateway, or serve the raw log (which would publish the
# APRS-IS passcode). It is unauthenticated, so it is for a trusted LAN only —
# see "Web monitor" in README.md before exposing it any further.
PI_WEB_MONITOR = yes
PI_WEB_PORT = 8080

# Size of the tmpfs mounted at run/. Everything there is regenerated on each
# start, so it lives in RAM rather than on the SD card: a card that is never
# written cannot be corrupted by pulling the plug. The packet log is rotated
# hourly at 8 MB keeping 2 generations, so this needs roughly 24 MB of headroom.
# Remember this comes out of 512 MB total.
PI_RUN_TMPFS_SIZE = 32M

# The Pi runs bare-metal, not Docker: 512 MB is too little to spend on a
# container runtime, and the gateway needs direct access to the radio's devices
# anyway. build_pi_image.sh writes DEPLOY_MODE = bare-metal into the Pi's own
# igate.local.conf, and installs igate.conf unchanged.
