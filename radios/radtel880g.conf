# Radio profile: Radtel 880G handheld on a Digirig Lite, through a hand-made
# adapter cable.
#
# Layer 1 of 5, the lowest priority: igate.conf, igate.local.conf, igate.secrets
# and the environment all override it. It holds hardware settings only — how to
# drive this radio — and never anything about what the station transmits. A
# profile that sets the whitelist, beacon, callsign or path is refused.
#
# Select it with RADIO = radtel880g, in igate.conf for every machine or in one
# machine's igate.local.conf for that machine. Check with ./deploy_igate.sh config.
#
# Electrically this is the same arrangement as radios/vx6r.conf: no CAT, a
# Digirig Lite as the sound card, and PTT by pulling the microphone line
# through the CM108's GPIO3. What differs is the cable and the radio's own
# audio levels, and those are the two things to confirm before trusting it.
#
# Before starting:
#
#   * Tune the radio to 144.390 MHz FM by hand. `up` cannot check it — there is
#     no CAT port, so the front panel is the only truth about frequency.
#   * Turn the battery saver OFF. A receive saver's sleep cycle cuts off the
#     start of an incoming packet, which shows up as poor decode rather than as
#     an obvious fault. The menu number differs between radios; check the
#     manual rather than assuming the VX-6R's Mode 53.
#   * Set a transmit time-out. PTT is a GPIO pin the interface holds, so a hung
#     host holds the radio keyed and the radio's own timer is the only backstop
#     (§14.3 of aprs-igate-prototype-test.md).
#   * Squelch open or just closed; volume low. The volume control is the
#     receive level into the Digirig.
#   * The hidraw node needs the udev rule in udev/99-igate-cm108.rules on the
#     machine the Digirig plugs into. `up` refuses to start without it.
#
# See README.md, "Quickstarts" and "Radio profiles".

RADIO_DESCRIPTION = Radtel 880G on a Digirig Lite (no CAT; PTT on CM108 GPIO3)

# --- Capabilities ---
CAT = none                         # no CAT: no rigctld, frequency set by hand
PTT_METHOD = cm108                 # PTT on a GPIO pin of the USB sound card

# --- Audio ---
ACHANNELS = 1
# auto: the card is found by USB_ID at every start, and again while `up` waits
# for the radio, so the Digirig can be in any USB port and can be replugged.
ADEVICE = auto
USB_ID = 0d8c:0012                 # C-Media CM108, as lsusb prints it

# --- PTT ---
# Blank: found on the same USB device as ADEVICE's card, so PTT always keys the
# interface whose audio is in use. Set /dev/hidrawN only to override that.
CM108_DEVICE =
CM108_GPIO = 3                     # Digirig Lite keys on GPIO3

# --- Mixer ---
MIXER_TX_CONTROL = Speaker Playback Volume
MIXER_RX_CONTROL = Mic Capture Volume
MIXER_AGC_CONTROL = Auto Gain Control

# The same values as radios/vx6r.conf, confirmed working on this radio through
# the hand-made adapter. 50% is Digirig's documented starting point for both.
#
# The receive level that matters is the radio's own VOLUME KNOB, not
# RX_AUDIO_LEVEL. The mixer sets how much of what arrives is used; the knob
# sets how much arrives. It is adjusted by hand and nothing here can read or
# check it — the same limitation as frequency on a radio with no CAT.
#
# If decodes stop after the radio has been off the gateway, suspect the volume
# knob before the configuration.
TX_AUDIO_LEVEL = 50%
RX_AUDIO_LEVEL = 50%
DISABLE_AGC = yes                  # Digirig's manual: AGC off for manual levels

# --- Radio settings at start ---
RADIO_SET_ON_UP = no               # nothing to set them over
