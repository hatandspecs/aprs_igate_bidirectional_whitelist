# Radio profile: Yaesu FTX-1 Optima on its single USB-C cable.
#
# Selected by RADIO = ftx1 in igate.conf, or in one machine's igate.local.conf.
# Hardware settings only: a profile may not set the whitelist, beacon, callsign or
# APRS-IS login, and deploy_igate.sh refuses a profile that tries.
#
# This is the LOWEST-priority layer. igate.conf overrides it for every machine and
# igate.local.conf overrides it for one. Change a value here when it is true of
# this radio wherever it is used — a calibrated audio level, say. Override it in a
# machine's igate.local.conf when it depends on the machine, as device paths do.
RADIO_DESCRIPTION = Yaesu FTX-1 Optima, USB-C: CP2105 CAT, HRI PTT, C-Media codec

# --- Capabilities ---
# CAT = hamlib     frequency and mode are controlled over serial CAT, via rigctld.
# PTT_METHOD = rig transmit is keyed by a CAT command, over the same rigctld.
#
# PTT by CAT command cannot fail safe: if the host loses power or USB drops
# mid-transmission, the unkey command is never sent and the radio stays keyed.
# The radio's own time-out timer is the only backstop. Keep it set.
CAT = hamlib
PTT_METHOD = rig

# --- Audio device (Section 5: `arecord -l`) ---
ACHANNELS = 1
ADEVICE = plughw:1,0

# --- Mixer controls ---
# This codec's ALSA control names. `./deploy_igate.sh audio` lists the names and
# ranges an interface really has; a wrong name here does nothing except print a
# Note at startup, so check them when adapting this profile to another radio.
MIXER_TX_CONTROL = Speaker Playback Volume
MIXER_RX_CONTROL = Mic Capture Volume
MIXER_AGC_CONTROL = Auto Gain Control

# --- Audio levels (ALSA mixer, re-applied on every `up`) ---
# These reset to device defaults whenever the radio's USB re-enumerates, and
# the defaults are WRONG in both directions: the default TX level over-
# deviates (signal is audible but undecodable) and the default capture gain
# is far too low to decode anything. Both fail silently, so `up` always
# re-applies these rather than trusting whatever survived.
#
# Either a raw value or a percentage. Prefer percentages: the raw scale differs
# between codecs and amixer clamps a too-large value SILENTLY, so "35" may mean
# 35% on one device and "maximum" on another. Run "./deploy_igate.sh audio" to
# see the actual ranges, the configured values, and what Direwolf is really
# reporting for received audio.
#
# TX stays a raw 10: calibrated 2026-09-07 against this radio at 1 W, where 10
# produced a signal that W3YA-1 digipeated and KB3KPP-1 gated, while 23 (the
# device default) and 33 both over-deviated and decoded nowhere. Do not convert
# it without recalibrating.
TX_AUDIO_LEVEL = 10

# 100%, i.e. the maximum the codec offers. Measured on this radio: the capture
# control ("Mic Capture Volume") has range 0-35, so the raw 35 used previously
# was ALREADY at maximum — and briefly setting 80% here lowered it to 28 and
# halved the received level, from a Direwolf-reported mean of 7.4 down to 3.5.
#
# At maximum, Direwolf reports 4-9 against the ~50 its advisory suggests, so the
# codec gain is not the limiting factor; the radio's own output level into its USB
# codec would be. Whether that matters is UNMEASURED: this station decodes many
# distinct stations cleanly at 4-9, and the reported figure varied 4.0 to 7.4 at
# identical gain, so it tracks which stations were heard as much as it tracks
# configuration. Raising the radio's output with capture gain already maxed can
# only move toward clipping, which does degrade AFSK. Do not tune this against
# the advisory alone — measure decode success before and after. See §15.
RX_AUDIO_LEVEL = 100%
DISABLE_AGC = yes

# --- Radio setup applied on every `up` (via CAT) ---
# Guards against the failure that cost hours during bring-up: in plain FM the
# FTX-1 modulates from the MIC input, not the USB codec, so Direwolf keys the
# radio and transmits a carrier with no data in it. PTT works, the waterfall
# shows a signal, and nothing anywhere can decode it. PKTFM is hamlib's name
# for the radio's FM-D (data FM) mode, verified: "M FM" -> FM, "M PKTFM" -> FM-D.
RADIO_SET_ON_UP = yes
RADIO_FREQ = 144390000
RADIO_MODE = PKTFM
RADIO_PASSBAND = 16000

# --- CAT / PTT (Section 8) ---
# The FTX-1 exposes CAT control and PTT as two separate serial ports over its
# single USB-C connection. Confirmed working via WSJT-X and the ftx1-tuner-sweep
# project: hamlib has no native FTX-1 model yet, but it CAT-controls cleanly
# as a Yaesu FT-991 (rigctl model 1035). See README.md for how this is wired.
RIG_MODEL = 1035          # hamlib model number; `rigctl --list` to find others
CAT_DEVICE = /dev/ttyUSB0 # CAT control port (frequency, mode, etc.)
CAT_BAUD = 38400
PTT_DEVICE = /dev/ttyACM0 # separate PTT port. Single-port radios: same as CAT_DEVICE
PTT_TYPE = RIG            # RIG = PTT via CAT command (hamlib's name for what
                          # WSJT-X calls the "CAT" PTT method). Other values:
                          # RTS, DTR, NONE — see README.md.
