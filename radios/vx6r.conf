# Radio profile: Yaesu VX-6R handheld on a Digirig Lite.
#
# Layer 1 of 5, the lowest priority: igate.conf, igate.local.conf, igate.secrets
# and the environment all override it. It holds hardware settings only — how to
# drive this radio — and never anything about what the station transmits. A
# profile that sets the whitelist, beacon, callsign or path is refused.
#
# Select it with RADIO = vx6r, in igate.conf for every machine or in one
# machine's igate.local.conf for that machine. Check with ./deploy_igate.sh config.
#
# The VX-6R has no CAT port, so nothing here can set or read its frequency. The
# Digirig Lite is a C-Media CM108 USB sound card with no serial port; it keys the
# radio by pulling the VX-6R's mic line through its GPIO3 pin. Before starting:
#
#   * Tune the radio to 144.390 MHz FM by hand. `up` cannot check it.
#   * Set Mode 53 RXSAVE = OFF. Yaesu's manual says the receive battery saver's
#     sleep cycle cuts off the start of incoming packets.
#   * Set Mode 67 TOT on (factory 3 minutes), 1 APO = OFF, 27 HLF.DEV = OFF.
#   * Squelch open or just closed (Set Mode 58 SQL), volume low; the VOL knob is
#     the receive level into the Digirig.
#   * The hidraw node needs the udev rule in udev/99-igate-cm108.rules on the
#     machine the Digirig plugs into. `up` refuses to start without it and says so.
#
# See README.md, "Quickstarts" and "Radio profiles".

RADIO_DESCRIPTION = Yaesu VX-6R on a Digirig Lite (no CAT; PTT on CM108 GPIO3)

# --- Capabilities ---
CAT = none                         # no CAT: no rigctld, frequency set by hand
PTT_METHOD = cm108                 # PTT on a GPIO pin of the USB sound card

# --- Audio ---
ACHANNELS = 1
# auto: the card is found by USB_ID at every start, and again while `up` waits
# for the radio, so the Digirig can be in any USB port and can be replugged.
# Override with a fixed plughw:N,0 in igate.local.conf when two C-Media
# interfaces are on one machine — auto refuses to guess between them.
ADEVICE = auto
USB_ID = 0d8c:0012                 # C-Media CM108, as lsusb prints it

# --- PTT ---
# Blank: found on the same USB device as ADEVICE's card, so PTT always keys the
# interface whose audio is in use. Set /dev/hidrawN only to override that.
CM108_DEVICE =
CM108_GPIO = 3                     # Digirig Lite keys on GPIO3

# --- Mixer ---
# The standard C-Media CM108 control names, confirmed on a Digirig Lite with
# ./deploy_igate.sh audio. A name the card does not have prints a note at start
# and changes nothing.
MIXER_TX_CONTROL = Speaker Playback Volume
MIXER_RX_CONTROL = Mic Capture Volume
MIXER_AGC_CONTROL = Auto Gain Control

# 50% is Digirig's documented starting point for both. On the Digirig Lite that is
# 18 of 0-37 (Speaker Playback) and 18 of 0-35 (Mic Capture), and at those levels
# this profile carried a full SMS round trip with a Yaesu FT5D, receiving at
# levels 57-86. Deviation also depends on the cable and the VX-6R's MCGAIN, so
# confirm transmit decodes on a new setup (README.md, "Testing it"): too high
# over-deviates and nothing decodes it. A percentage is used because the raw scale
# differs between devices and amixer clamps an out-of-range number silently.
TX_AUDIO_LEVEL = 50%
RX_AUDIO_LEVEL = 50%
DISABLE_AGC = yes                  # Digirig's manual: AGC off for manual levels

# --- Radio settings at start ---
RADIO_SET_ON_UP = no               # nothing to set them over
