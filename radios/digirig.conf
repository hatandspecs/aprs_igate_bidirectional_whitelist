# Interface profile: any radio on a Digirig Lite.
#
# This one is named for the interface rather than the radio, and that is the
# point. It replaced separate vx6r.conf and radtel880g.conf profiles which,
# once written, turned out to differ in exactly one line — the description.
# Every setting below was identical, because none of them describes the radio.
# They describe the Digirig: its C-Media codec is the sound card, its CM108
# GPIO3 is the PTT line, and its mixer controls have fixed names.
#
# What the radio contributes is a speaker jack, a microphone jack, and a
# volume knob. Any handheld or mobile with that arrangement and a cable to
# match has worked on this interface without changing a value here.
#
# Layer 1 of 5, the lowest priority: igate.conf, igate.local.conf, igate.secrets
# and the environment all override it. It holds hardware settings only — how to
# drive the interface — and never anything about what the station transmits. A
# profile that sets the whitelist, beacon, callsign or path is refused.
#
# Select it with RADIO = digirig, in igate.conf for every machine or in one
# machine's igate.local.conf for that machine. Check with ./deploy_igate.sh config.
#
# Known to work on this profile unchanged:
#
#   Yaesu VX-6R      full SMS round trip, laptop (docker) and pi-gate (bare metal)
#   Radtel 880G      through a hand-made adapter cable
#   Yaesu FT-2900R   pi-gate, bare metal: receives, and a gated SMS from
#                    APRS-IS was transmitted and received on a handheld
#
# The FT-2900R was on this list once before on the strength of the other two
# rather than on any transmission of its own, and that was premature: the first
# attempt failed, in the cable rather than in anything here. The adapter was in
# backwards, which asserted PTT the moment it was plugged into the Digirig Lite
# — with nothing running, and nothing in software able to prevent it. The radio
# keyed a dead carrier, its time-out timer cut transmit off, and because PTT was
# never released the radio stayed in transmit-inhibit from then on. The station
# received perfectly, Direwolf reported every transmission as sent, and nothing
# reached the air for as long as it took to find. See "A cable that keys PTT on
# insertion" below; turning the cable round fixed it and delivery was
# immediate.
#
# The FTX-1 is NOT on this list and has its own profile: it presents its own
# codec over USB and is keyed over CAT, so almost nothing here applies to it.
#
# --- What this profile cannot set, and you must ---
#
# None of the following is a Digirig property, so none of it is here. Each one
# is a way for the station to look healthy and carry nothing.
#
#   * Frequency. Tune the radio to 144.390 MHz FM by hand. There is no CAT
#     port on any of these, so the front panel is the only truth about where
#     the radio is listening — `up` cannot check it.
#   * Transmit power. A front-panel step on these radios, with no CAT port to
#     set it over, so `up` can neither read nor change it. It is not a detail:
#     on the FT-2900R at LOW1 the beacon reached W3YA-1 10.3 km away on two of
#     three attempts, which is a working path and not a reliable one. If gated
#     messages start going undelivered, the power step is the first thing to
#     check on the radio, and TX_AUDIO_LEVEL below is the second — under-
#     deviation degrades a marginal link the same way low power does.
#   * The volume knob. This is the receive level that matters, not
#     RX_AUDIO_LEVEL: the mixer sets how much of what arrives gets used, the
#     knob sets how much arrives. Nothing here can read it. If decodes stop
#     after the radio has been off the gateway, suspect the knob before the
#     configuration.
#   * Battery saver OFF. A receive saver's sleep cycle cuts the start off an
#     incoming packet, which presents as poor decode rather than as a fault.
#     The menu number differs by radio — it is Mode 53 on the VX-6R; check the
#     manual rather than assuming it is the same anywhere else.
#   * A transmit time-out. PTT is a GPIO pin the interface holds, so a hung
#     host holds the radio keyed and the radio's own timer is the only backstop
#     (§14.3 of aprs-igate-prototype-test.md).
#   * Squelch open or just closed.
#
# The hidraw node needs the udev rule in udev/99-igate-cm108.rules on the
# machine the Digirig plugs into. `up` refuses to start without it.
#
# --- A cable that keys PTT on insertion ---
#
# PTT is a contact on the Digirig's jack, so a cable can assert it with no
# software involved at all. A 3-conductor TRS plug in the Digirig's 4-conductor
# TRRS jack bridges the second ring onto the sleeve, and that contact is PTT: it
# is grounded the instant the plug seats.
#
# The ends of these adapter cables are not interchangeable, and the cable will
# seat either way round. The Digirig end is the TRRS; the radio end of an
# FT-2900R adapter is the TRS, because that end goes to the radio's speaker
# jack. Fitted the other way about — TRS into the Digirig, TRRS into the
# speaker jack — the cable keys PTT permanently and this is the failure that
# follows. A miswired hand-made adapter does the same thing.
#
# Nothing here can detect it, and the symptoms point the wrong way: receive is
# unaffected because it arrives on a different conductor, and Direwolf reports
# `[0L]` for every frame it hands to the modem whether or not the radio is
# listening. A station in this state looks healthy in the log and on the web
# monitor while transmitting nothing.
#
# The tell is the radio, not the software. Watch the Digirig's PTT light with
# the cable plugged in and nothing running: if it is lit, no configuration in
# this file is involved. Bisect it by plugging the cable into the Digirig with
# the radio end connected to nothing — still lit means the cable or its plug,
# dark means the radio end. Before reaching for a meter, check the cable is not
# in backwards: count the insulating bands on each plug — three on the TRRS that
# belongs in the Digirig, two on the TRS. With nothing on the radio end, a meter
# across the PTT conductor and the sleeve should read open.
#
# See README.md, "Quickstarts" and "Radio profiles".

RADIO_DESCRIPTION = Any radio on a Digirig Lite (no CAT; PTT on CM108 GPIO3)

# --- Capabilities ---
CAT = none                         # no CAT: no rigctld, frequency set by hand
PTT_METHOD = cm108                 # PTT on a GPIO pin of the USB sound card

# --- Audio ---
ACHANNELS = 1
# auto: the card is found by USB_ID at every start, and again while `up` waits
# for the radio, so the Digirig can be in any USB port and can be replugged.
ADEVICE = auto
USB_ID = 0d8c:0012                 # C-Media CM108, as lsusb prints it

# --- PTT ---
# Blank: found on the same USB device as ADEVICE's card, so PTT always keys the
# interface whose audio is in use. Set /dev/hidrawN only to override that.
CM108_DEVICE =
CM108_GPIO = 3                     # Digirig Lite keys on GPIO3

# --- Mixer ---
MIXER_TX_CONTROL = Speaker Playback Volume
MIXER_RX_CONTROL = Mic Capture Volume
MIXER_AGC_CONTROL = Auto Gain Control

# 50% is Digirig's documented starting point for both, and it has not needed
# changing for any radio tried on it. Received levels ran 57-86 at this capture
# gain with no clipping, and transmit at this level decoded.
TX_AUDIO_LEVEL = 50%
RX_AUDIO_LEVEL = 50%
DISABLE_AGC = yes                  # Digirig's manual: AGC off for manual levels

# --- Radio settings at start ---
RADIO_SET_ON_UP = no               # nothing to set them over
