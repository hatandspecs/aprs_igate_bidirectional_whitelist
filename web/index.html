<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>iGate Monitor</title>
<style>
  :root {
    --bg:#15181d; --panel:#1d2128; --line:#2b3139;
    --fg:#e6e9ef; --dim:#8b95a5; --accent:#6aa8ff;
    --rx:#5ba7f7; --up:#c98bdb; --gated:#4ecf7a; --drop:#f2686a;
    --tx:#4ad6d6; --srv:#b48ce0; --warn:#f0b429; --info:#4ecf7a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f5f6f8; --panel:#ffffff; --line:#dfe3ea;
      --fg:#1c2028; --dim:#5f6b7c; --accent:#1f6feb;
      --rx:#1f6feb; --up:#8250df; --gated:#1a7f37; --drop:#cf222e;
      --tx:#0f7c86; --srv:#8250df; --warn:#9a6700; --info:#1a7f37;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
  }

  header {
    position:sticky; top:0; z-index:5;
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:.6rem .9rem;
    display:flex; flex-wrap:wrap; align-items:center; gap:.5rem .9rem;
  }
  h1 { font-size:1rem; margin:0; font-weight:650; letter-spacing:.01em; }
  h1 small { color:var(--dim); font-weight:400; margin-left:.35rem; }
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; margin-left:auto; }
  .chip {
    font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:.34rem .5rem; border-radius:999px;
    border:1px solid var(--line); color:var(--dim); white-space:nowrap;
  }
  .chip b { color:var(--fg); font-weight:600; }
  .chip.ok { color:var(--gated); border-color:color-mix(in srgb,var(--gated) 45%,transparent); }
  .chip.bad { color:var(--drop); border-color:color-mix(in srgb,var(--drop) 45%,transparent); }
  .chip.live { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%,transparent); }

  details.info {
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  details.info > summary {
    cursor:pointer; padding:.55rem .9rem; color:var(--dim);
    font-size:.82rem; user-select:none;
  }
  details.info > summary:hover { color:var(--fg); }
  .grid {
    display:grid; gap:.5rem 1.2rem; padding:0 .9rem .8rem;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  }
  .kv { min-width:0; }
  .kv dt {
    color:var(--dim); font-size:.7rem; text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:.12rem;
  }
  .kv dd {
    margin:0; font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow-wrap:anywhere;
  }
  .kv dd.mark { color:var(--warn); }

  #log {
    flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:.5rem .6rem 3.5rem;
    font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-overflow-scrolling:touch;
  }
  .row { display:flex; gap:.55rem; padding:.1rem 0; }
  .row .t { color:var(--dim); flex:none; }
  .row .l { flex:none; font-weight:700; }
  .row .m { min-width:0; overflow-wrap:anywhere; }
  .detail {
    color:var(--dim); padding:.05rem 0 .05rem 1.1rem;
    overflow-wrap:anywhere; font-size:12px;
  }
  .note { color:var(--warn); padding:.25rem 0; }

  .l-rfrx      { color:var(--rx); }
  .l-rfisup    { color:var(--up); }
  .l-isgated   { color:var(--gated); }
  .l-isdrop    { color:var(--drop); }
  .l-txlocal   { color:var(--tx); }
  .l-isserver,.l-islogin { color:var(--srv); }
  .l-warn      { color:var(--warn); }
  .l-info      { color:var(--info); }

  .empty { color:var(--dim); padding:1.5rem .4rem; }

  #jump {
    position:fixed; right:.9rem; bottom:.9rem; z-index:6;
    background:var(--accent); color:#fff; border:0; border-radius:999px;
    padding:.6rem 1rem; font:600 12px/1 inherit; cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.35); display:none;
  }
  #jump.show { display:block; }

  /* Phones: the timestamp column is the first thing worth losing. */
  @media (max-width:560px) {
    header { padding:.5rem .6rem; }
    h1 { font-size:.92rem; width:100%; }
    .chips { margin-left:0; width:100%; }
    .row { flex-wrap:wrap; gap:.35rem; }
    .row .t { font-size:11px; }
    #log { padding:.4rem .5rem 3.5rem; font-size:12px; }
    .grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>iGate Monitor <small id="host"></small></h1>
  <div class="chips">
    <span class="chip" id="c-state">state <b>…</b></span>
    <span class="chip" id="c-call">call <b>…</b></span>
    <span class="chip" id="c-wl">whitelist <b>…</b></span>
    <span class="chip" id="c-feed">feed <b>connecting</b></span>
  </div>
</header>

<details class="info" id="panel">
  <summary>Station and whitelist</summary>
  <div class="grid" id="settings"></div>
</details>

<div id="log" aria-live="polite">
  <div class="empty">Waiting for packets… 144.390 is not continuously busy, so this
  can be quiet for a minute or two.</div>
</div>

<button id="jump">↓ Live</button>

<script>
(function () {
  "use strict";

  var logEl   = document.getElementById("log");
  var jumpEl  = document.getElementById("jump");
  var emptyEl = logEl.querySelector(".empty");
  var pinned  = true;           // follow the tail unless the reader scrolls up
  var MAX_ROWS = 600;

  // --- status -------------------------------------------------------------

  var SHOW = [
    ["MYCALL", "Station callsign"],
    ["WHITELIST_CALLS", "Whitelist (TX to RF)"],
    ["BEACON", "Beacon"],
    ["TX_VIA", "Transmit path"],
    ["RX_VIA", "Gating"],
    ["ADEVICE", "Audio device"],
    ["CAT_DEVICE", "CAT port"],
    ["PTT_DEVICE", "PTT port"],
    ["IGSERVER", "APRS-IS server"],
    ["DEPLOY_MODE", "Mode"],
    ["IGTXLIMIT", "TX rate limit"]
  ];

  function chip(id, value, cls) {
    var el = document.getElementById(id);
    el.querySelector("b").textContent = value;
    el.className = "chip" + (cls ? " " + cls : "");
  }

  function renderStatus(s) {
    document.getElementById("host").textContent = s.host ? "· " + s.host : "";

    if (s.running) {
      chip("c-state", "running", "ok");
    } else {
      chip("c-state", "stopped", "bad");
    }
    var set = s.settings || {};
    chip("c-call", set.MYCALL || "—");
    chip("c-wl", set.WHITELIST_CALLS || "—");

    var grid = document.getElementById("settings");
    grid.textContent = "";
    SHOW.forEach(function (pair) {
      if (!set[pair[0]]) { return; }
      var dl = document.createElement("dl");
      dl.className = "kv";
      var dt = document.createElement("dt");
      dt.textContent = pair[1];
      var dd = document.createElement("dd");
      dd.textContent = set[pair[0]];
      // Draw the eye to settings that mean something is being transmitted.
      if (/TRANSMITTED ON RF|ONLY gate/.test(set[pair[0]])) { dd.className = "mark"; }
      dl.appendChild(dt); dl.appendChild(dd); grid.appendChild(dl);
    });

    if (s.filter) {
      var dl2 = document.createElement("dl");
      dl2.className = "kv";
      var dt2 = document.createElement("dt");
      dt2.textContent = "Resolved Direwolf filter";
      var dd2 = document.createElement("dd");
      dd2.textContent = s.filter;
      dl2.appendChild(dt2); dl2.appendChild(dd2); grid.appendChild(dl2);
    }

    // Whatever "is-running" reported: container status in docker mode, pids in
    // bare-metal. The page does not need to know which mode it is looking at.
    if (s.detail) {
      var dl3 = document.createElement("dl");
      dl3.className = "kv";
      var dt3 = document.createElement("dt");
      dt3.textContent = "Processes";
      var dd3 = document.createElement("dd");
      dd3.textContent = s.detail;
      dl3.appendChild(dt3); dl3.appendChild(dd3); grid.appendChild(dl3);
    }
  }

  function pollStatus() {
    fetch("/api/status", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(renderStatus)
      .catch(function () { chip("c-state", "unreachable", "bad"); });
  }
  pollStatus();
  setInterval(pollStatus, 15000);

  // --- log ----------------------------------------------------------------

  function labelClass(label) {
    return "l-" + label.toLowerCase().replace(/[^a-z]/g, "");
  }

  function append(node) {
    if (emptyEl && emptyEl.parentNode) { emptyEl.remove(); }
    logEl.appendChild(node);
    while (logEl.childNodes.length > MAX_ROWS) { logEl.removeChild(logEl.firstChild); }
    if (pinned) { logEl.scrollTop = logEl.scrollHeight; }
  }

  function addEvent(ev) {
    var row = document.createElement("div");
    row.className = "row";
    var t = document.createElement("span");
    t.className = "t"; t.textContent = ev.time;
    var l = document.createElement("span");
    l.className = "l " + labelClass(ev.label); l.textContent = ev.label;
    var m = document.createElement("span");
    m.className = "m"; m.textContent = ev.text;
    row.appendChild(t); row.appendChild(l); row.appendChild(m);
    append(row);
  }

  function addDetail(ev) {
    var d = document.createElement("div");
    d.className = "detail"; d.textContent = ev.text;
    append(d);
  }

  function addNote(ev) {
    var n = document.createElement("div");
    n.className = "note"; n.textContent = ev.text;
    append(n);
  }

  logEl.addEventListener("scroll", function () {
    var atEnd = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
    pinned = atEnd;
    jumpEl.classList.toggle("show", !atEnd);
  });

  jumpEl.addEventListener("click", function () {
    pinned = true;
    logEl.scrollTop = logEl.scrollHeight;
    jumpEl.classList.remove("show");
  });

  // EventSource reconnects by itself, which is the main reason for choosing SSE
  // over a WebSocket here.
  var es = new EventSource("/events");
  es.onopen = function () { chip("c-feed", "live", "live"); };
  es.onerror = function () { chip("c-feed", "reconnecting", "bad"); };
  es.onmessage = function (msg) {
    var ev;
    try { ev = JSON.parse(msg.data); } catch (e) { return; }
    if (ev.kind === "event") { addEvent(ev); }
    else if (ev.kind === "detail") { addDetail(ev); }
    else if (ev.kind === "note") { addNote(ev); }
  };
}());
</script>
</body>
</html>
