<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>iGate Monitor</title>
<style>
  :root {
    --bg:#15181d; --panel:#1d2128; --line:#2b3139;
    --fg:#e6e9ef; --dim:#8b95a5; --accent:#6aa8ff;
    --rx:#5ba7f7; --up:#c98bdb; --gated:#4ecf7a; --drop:#f2686a;
    --tx:#4ad6d6; --srv:#b48ce0; --warn:#f0b429; --info:#4ecf7a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f5f6f8; --panel:#ffffff; --line:#dfe3ea;
      --fg:#1c2028; --dim:#5f6b7c; --accent:#1f6feb;
      --rx:#1f6feb; --up:#8250df; --gated:#1a7f37; --drop:#cf222e;
      --tx:#0f7c86; --srv:#8250df; --warn:#9a6700; --info:#1a7f37;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
  }

  header {
    position:sticky; top:0; z-index:5;
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:.6rem .9rem;
    display:flex; flex-wrap:wrap; align-items:center; gap:.5rem .9rem;
  }
  h1 { font-size:1rem; margin:0; font-weight:650; letter-spacing:.01em; }
  h1 small { color:var(--dim); font-weight:400; margin-left:.35rem; }
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; margin-left:auto; }
  .chip {
    font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:.34rem .5rem; border-radius:999px;
    border:1px solid var(--line); color:var(--dim); white-space:nowrap;
  }
  .chip b { color:var(--fg); font-weight:600; }
  .chip.ok { color:var(--gated); border-color:color-mix(in srgb,var(--gated) 45%,transparent); }
  .chip.bad { color:var(--drop); border-color:color-mix(in srgb,var(--drop) 45%,transparent); }
  .chip.live { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%,transparent); }

  .tsv { overflow-x:auto; margin-top:.5rem; padding:0 .9rem .3rem; }
  .tsv table { border-collapse:collapse; font-size:.78rem; width:100%; }
  .tsv th, .tsv td {
    padding:.2rem .45rem; text-align:right; white-space:nowrap;
    border-bottom:1px solid color-mix(in srgb,var(--fg) 12%,transparent);
    /* Equal-width digits, so a column of counts lines up. Deliberately NOT
       on the stat-tile values, where they make a short number look loose. */
    font-variant-numeric:tabular-nums;
  }
  .tsv th { color:var(--dim); font-weight:500; }
  .tsv td:first-child, .tsv th:first-child { text-align:left; }
  .tsv td.gap { color:var(--warn); }

  /* --- stat tiles with a 7-day sparkline ------------------------------- */
  .tiles {
    display:grid; gap:.5rem .9rem; padding:0 .9rem .5rem;
    grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  }
  .tile { min-width:0; }
  .tile .lbl {
    color:var(--dim); font-size:.7rem; text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:.1rem;
  }
  /* Proportional figures on the value: tabular-nums makes a standalone
     number read loose at this size. Same sans as the rest of the page. */
  .tile .val { font-size:1.35rem; font-weight:650; line-height:1.1; }
  .tile .sub { color:var(--dim); font-size:.68rem; margin-top:.1rem; }
  .tile .sub b { color:var(--warn); font-weight:600; }
  .tile svg { display:block; margin:.25rem 0 .1rem; width:100%; height:26px; }

  /* Live counters. One row, the same hue per metric as the feed below, so
     color follows the metric and not its position. */
  .live { display:flex; flex-wrap:wrap; gap:.4rem; padding:0 .9rem .6rem; }
  .live .c {
    font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:.34rem .5rem; border-radius:999px; white-space:nowrap;
    border:1px solid var(--line); color:var(--dim);
  }
  .live .c b { font-weight:700; font-variant-numeric:tabular-nums; }
  .live .c.rx     { color:var(--rx);    border-color:color-mix(in srgb,var(--rx) 40%,transparent); }
  .live .c.up     { color:var(--up);    border-color:color-mix(in srgb,var(--up) 40%,transparent); }
  .live .c.gated  { color:var(--gated); border-color:color-mix(in srgb,var(--gated) 40%,transparent); }
  .live .c.drop   { color:var(--drop);  border-color:color-mix(in srgb,var(--drop) 40%,transparent); }
  .live .c.tx     { color:var(--tx);    border-color:color-mix(in srgb,var(--tx) 40%,transparent); }

  .caveat {
    color:var(--dim); font-size:.7rem; padding:0 .9rem .7rem;
    max-width:62ch;
  }
  .caveat b { color:var(--warn); font-weight:600; }
  details.info {
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  details.info > summary {
    cursor:pointer; padding:.55rem .9rem; color:var(--dim);
    font-size:.82rem; user-select:none;
  }
  details.info > summary:hover { color:var(--fg); }
  .grid {
    display:grid; gap:.5rem 1.2rem; padding:0 .9rem .8rem;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  }
  .kv { min-width:0; }
  .kv dt {
    color:var(--dim); font-size:.7rem; text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:.12rem;
  }
  .kv dd {
    margin:0; font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow-wrap:anywhere;
  }
  .kv dd.mark { color:var(--warn); }

  #log {
    flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:.5rem .6rem 3.5rem;
    font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-overflow-scrolling:touch;
  }
  .row { display:flex; gap:.55rem; padding:.1rem 0; }
  .row .t { color:var(--dim); flex:none; }
  .row .l { flex:none; font-weight:700; }
  .row .m { min-width:0; overflow-wrap:anywhere; }
  .detail {
    color:var(--dim); padding:.05rem 0 .05rem 1.1rem;
    overflow-wrap:anywhere; font-size:12px;
  }
  .note { color:var(--warn); padding:.25rem 0; }

  .l-rfrx      { color:var(--rx); }
  .l-rfisup    { color:var(--up); }
  .l-isgated   { color:var(--gated); }
  .l-isdrop    { color:var(--drop); }
  .l-txlocal   { color:var(--tx); }
  .l-isserver,.l-islogin { color:var(--srv); }
  .l-warn      { color:var(--warn); }
  .l-info      { color:var(--info); }

  .empty { color:var(--dim); padding:1.5rem .4rem; }

  #jump {
    position:fixed; right:.9rem; bottom:.9rem; z-index:6;
    background:var(--accent); color:#fff; border:0; border-radius:999px;
    padding:.6rem 1rem; font:600 12px/1 inherit; cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.35); display:none;
  }
  #jump.show { display:block; }

  /* Phones: the timestamp column is the first thing worth losing. */
  @media (max-width:560px) {
    header { padding:.5rem .6rem; }
    h1 { font-size:.92rem; width:100%; }
    .chips { margin-left:0; width:100%; }
    .row { flex-wrap:wrap; gap:.35rem; }
    .row .t { font-size:11px; }
    #log { padding:.4rem .5rem 3.5rem; font-size:12px; }
    .grid { grid-template-columns:1fr; }
    /* Two tiles across rather than one: the whole point is comparing them. */
    .tiles { grid-template-columns:repeat(2,1fr); gap:.5rem .6rem; }
    .tile .val { font-size:1.15rem; }
  }
</style>
</head>
<body>

<header>
  <h1>iGate Monitor <small id="host"></small></h1>
  <div class="chips">
    <span class="chip" id="c-state">state <b>…</b></span>
    <span class="chip" id="c-call">call <b>…</b></span>
    <span class="chip" id="c-wl">whitelist <b>…</b></span>
    <span class="chip" id="c-feed">feed <b>connecting</b></span>
  </div>
</header>

<details class="info" id="panel">
  <summary>Station and whitelist</summary>
  <div class="grid" id="settings"></div>
</details>

<details class="info" id="trafficpanel" open>
  <summary>Traffic <small id="trafficchip"></small></summary>
  <div class="live" id="live"></div>
  <div class="tiles" id="tiles"></div>
  <div class="caveat" id="trafficnote"></div>
  <div class="tsv" id="daily"></div>
</details>

<details class="info" id="logpanel">
  <summary>Logging and archive <small id="logchip"></small></summary>
  <div class="grid" id="logging"></div>
</details>

<div id="log" aria-live="polite">
  <div class="empty">Waiting for packets… 144.390 is not continuously busy, so this
  can be quiet for a minute or two.</div>
</div>

<button id="jump">↓ Live</button>

<script>
(function () {
  "use strict";

  var logEl   = document.getElementById("log");
  var jumpEl  = document.getElementById("jump");
  var emptyEl = logEl.querySelector(".empty");
  var pinned  = true;           // follow the tail unless the reader scrolls up
  var MAX_ROWS = 600;

  // --- status -------------------------------------------------------------

  var SHOW = [
    ["MYCALL", "Station callsign"],
    ["RADIO", "Radio profile"],
    ["PTT_METHOD", "PTT method"],
    ["WHITELIST_CALLS", "Whitelist (TX to RF)"],
    ["BEACON", "Beacon"],
    ["TX_VIA", "Transmit path"],
    ["RX_VIA", "Gating"],
    ["ADEVICE", "Audio device"],
    ["CAT_DEVICE", "CAT port"],
    ["PTT_DEVICE", "PTT port"],
    ["CM108_DEVICE", "PTT device (CM108)"],
    ["IGSERVER", "APRS-IS server"],
    ["DEPLOY_MODE", "Mode"],
    ["LOCAL_CONFIG", "Machine config"],
    ["IGTXLIMIT", "TX rate limit"]
  ];

  // The header chips only. Each has a <b> holding its value; the panel
  // headlines are bare <small> elements and go through headline() instead.
  //
  // The guard is not defensive clutter. renderLogging used to call this on
  // #logchip, which has no <b>, so `querySelector("b").textContent = v` threw
  // on the one path it was written for -- a logging panel reporting itself
  // unavailable. The throw propagated out of renderStatus into the fetch's
  // .catch, which set the state chip to "unreachable", so a readable station
  // with an unreadable archive directory displayed as an unreachable gateway.
  function chip(id, value, cls) {
    var el = document.getElementById(id);
    if (!el) { return; }
    var b = el.querySelector("b");
    if (b) { b.textContent = value; } else { el.textContent = value; }
    el.className = "chip" + (cls ? " " + cls : "");
  }

  function headline(id, text) {
    var el = document.getElementById(id);
    if (el) { el.textContent = text || ""; }
  }

  function renderStatus(s) {
    document.getElementById("host").textContent = s.host ? "· " + s.host : "";

    if (s.running) {
      chip("c-state", "running", "ok");
    } else {
      chip("c-state", "stopped", "bad");
    }
    var set = s.settings || {};
    chip("c-call", set.MYCALL || "—");
    chip("c-wl", set.WHITELIST_CALLS || "—");

    var grid = document.getElementById("settings");
    grid.textContent = "";
    SHOW.forEach(function (pair) {
      if (!set[pair[0]]) { return; }
      var dl = document.createElement("dl");
      dl.className = "kv";
      var dt = document.createElement("dt");
      dt.textContent = pair[1];
      var dd = document.createElement("dd");
      dd.textContent = set[pair[0]];
      // Draw the eye to settings that mean something is being transmitted.
      if (/TRANSMITTED ON RF|ONLY gate/.test(set[pair[0]])) { dd.className = "mark"; }
      dl.appendChild(dt); dl.appendChild(dd); grid.appendChild(dl);
    });

    if (s.filter) {
      var dl2 = document.createElement("dl");
      dl2.className = "kv";
      var dt2 = document.createElement("dt");
      dt2.textContent = "Resolved Direwolf filter";
      var dd2 = document.createElement("dd");
      dd2.textContent = s.filter;
      dl2.appendChild(dt2); dl2.appendChild(dd2); grid.appendChild(dl2);
    }

    // Order matters only for readability: traffic first, because that is the
    // panel left open. Each guards its own input, so neither can stop the
    // other from rendering.
    try {
      renderTraffic(s);
    } catch (e) {
      headline("trafficchip", "· unavailable");
    }
    renderLogging(s.logging, s.today);

    // Whatever "is-running" reported: container status in docker mode, pids in
    // bare-metal. The page does not need to know which mode it is looking at.
    if (s.detail) {
      var dl3 = document.createElement("dl");
      dl3.className = "kv";
      var dt3 = document.createElement("dt");
      dt3.textContent = "Processes";
      var dd3 = document.createElement("dd");
      dd3.textContent = s.detail;
      dl3.appendChild(dt3); dl3.appendChild(dd3); grid.appendChild(dl3);
    }
  }

  function bytes(n) {
    if (n === null || n === undefined) { return "—"; }
    if (n < 1024) { return n + " B"; }
    if (n < 1048576) { return (n / 1024).toFixed(0) + " kB"; }
    return (n / 1048576).toFixed(1) + " MB";
  }

  function since(sec) {
    if (sec === null || sec === undefined) { return "—"; }
    if (sec < 90) { return sec + "s ago"; }
    if (sec < 5400) { return Math.round(sec / 60) + " min ago"; }
    return Math.round(sec / 3600) + " h ago";
  }

  // --- numbers -------------------------------------------------------------

  // Thousands separators up to 5 figures, then compact. "—" for a number that
  // was not measured, which is never the same thing as zero.
  function num(n) {
    if (n === null || n === undefined || n === "") { return "—"; }
    n = Number(n);
    if (!isFinite(n)) { return "—"; }
    if (Math.abs(n) < 100000) { return n.toLocaleString(); }
    if (Math.abs(n) < 1e6) { return (n / 1000).toFixed(1) + "K"; }
    return (n / 1e6).toFixed(2) + "M";
  }

  function clock(epochSeconds) {
    if (!epochSeconds) { return "—"; }
    var d = new Date(epochSeconds * 1000);
    return d.toTimeString().slice(0, 8);
  }

  // A DURATION, not an age. `since()` says "24 h ago" for when something
  // last happened; this says "24 h" for how long a counter has been running,
  // which is what the live row needs in front of it. The live counters and
  // the tiles below them cover different spans, and on 2026-11-18 that read
  // as a contradiction: the live row said 6 gated to RF over its 24 hours
  // and the tile said 12 over the two days it had, which is the same 6 a day
  // twice. Neither number was wrong and nothing on the page said so.
  function dur(sec) {
    if (sec === null || sec === undefined || !isFinite(sec)) { return "—"; }
    if (sec < 90) { return Math.round(sec) + " s"; }
    if (sec < 5400) { return Math.round(sec / 60) + " min"; }
    if (sec < 172800) { return (sec / 3600).toFixed(1) + " h"; }
    return (sec / 86400).toFixed(1) + " days";
  }

  // --- sparkline -----------------------------------------------------------

  var SVGNS = "http://www.w3.org/2000/svg";

  /**
   * A seven-day bar sparkline.
   *
   * points: [{day, value, state}], oldest first. `state` is "ok",
   * "partial" or "absent".
   *
   * Two decisions worth keeping:
   *
   *   A day that was NOT MEASURED is never drawn as a bar. A reboot clears
   *   the tmpfs the console log lives in, so the gated counts for that day
   *   are an undercount; drawn to scale it would read as a quiet day, which
   *   is the single most misleading thing this panel could do. Those days get
   *   a hairline track at the baseline and say so on hover, and the tile
   *   prints how many of the seven were measured.
   *
   *   The bars are a dimmed step of the metric's own hue with the newest day
   *   at full strength, so identity comes from the hue the same metric wears
   *   in the live feed and in its chip, never from position.
   */
  function spark(points, hue) {
    var W = 112, H = 26, BASE = H - 1, GAP = 2;
    var svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("role", "img");
    var n = points.length || 1;
    var bw = Math.max(2, (W - GAP * (n - 1)) / n);
    var measured = points.filter(function (p) {
      return p.state !== "absent" && p.value !== null && p.value !== undefined;
    });
    var max = 0;
    measured.forEach(function (p) { if (p.value > max) { max = p.value; } });

    var names = points.map(function (p) {
      if (p.state === "absent") { return p.day + ": no row"; }
      if (p.state === "partial") {
        return p.day + ": " + num(p.value) + " (partial, log did not span the day)";
      }
      return p.day + ": " + num(p.value);
    });
    svg.setAttribute("aria-label", names.join("; "));

    // Baseline: a solid hairline one shade off the surface, no gridlines.
    var base = document.createElementNS(SVGNS, "line");
    base.setAttribute("x1", 0); base.setAttribute("x2", W);
    base.setAttribute("y1", BASE + 0.5); base.setAttribute("y2", BASE + 0.5);
    base.setAttribute("stroke", "currentColor");
    base.setAttribute("stroke-opacity", ".22");
    svg.appendChild(base);

    points.forEach(function (p, i) {
      var x = i * (bw + GAP);
      var newest = i === points.length - 1;
      var g = document.createElementNS(SVGNS, "g");
      var title = document.createElementNS(SVGNS, "title");
      title.textContent = names[i];
      g.appendChild(title);

      if (p.state === "absent" || p.value === null || p.value === undefined) {
        // Not measured: a stub at the baseline, not a zero-height bar at it.
        var stub = document.createElementNS(SVGNS, "rect");
        stub.setAttribute("x", x); stub.setAttribute("y", BASE - 1);
        stub.setAttribute("width", bw); stub.setAttribute("height", 2);
        stub.setAttribute("rx", 1);
        stub.setAttribute("fill", "currentColor");
        stub.setAttribute("fill-opacity", ".28");
        g.appendChild(stub);
      } else {
        var h = max > 0 ? Math.max(2, (p.value / max) * (BASE - 3)) : 2;
        var r = document.createElementNS(SVGNS, "rect");
        r.setAttribute("x", x); r.setAttribute("y", BASE - h);
        r.setAttribute("width", bw); r.setAttribute("height", h);
        r.setAttribute("rx", Math.min(2, bw / 2));
        r.setAttribute("fill", hue);
        r.setAttribute("fill-opacity",
                       newest ? "1" : (p.state === "partial" ? ".3" : ".55"));
        g.appendChild(r);
      }
      // A hit target the full height of the chart, including the gap, so a
      // 14px bar is not a 14px target.
      var hit = document.createElementNS(SVGNS, "rect");
      hit.setAttribute("x", x - GAP / 2); hit.setAttribute("y", 0);
      hit.setAttribute("width", bw + GAP); hit.setAttribute("height", H);
      hit.setAttribute("fill", "transparent");
      g.appendChild(hit);
      svg.appendChild(g);
    });
    return svg;
  }

  /** label · value · sparkline · sub. Sentence case, no trailing colon. */
  function tile(parent, spec) {
    var d = document.createElement("div");
    d.className = "tile";
    var l = document.createElement("div");
    l.className = "lbl"; l.textContent = spec.label;
    var v = document.createElement("div");
    v.className = "val"; v.textContent = spec.value;
    v.style.color = spec.hue || "inherit";
    d.appendChild(l); d.appendChild(v);
    if (spec.points && spec.points.length) {
      d.appendChild(spark(spec.points, spec.hue || "currentColor"));
    }
    if (spec.sub) {
      var s = document.createElement("div");
      s.className = "sub";
      // One bolded fragment at most, for the "not all days measured" case.
      if (spec.warn) {
        s.appendChild(document.createTextNode(spec.sub + " · "));
        var b = document.createElement("b");
        b.textContent = spec.warn;
        s.appendChild(b);
      } else {
        s.textContent = spec.sub;
      }
      d.appendChild(s);
    }
    parent.appendChild(d);
    return d;
  }

  // --- traffic -------------------------------------------------------------

  var CSSVAR = function (name) {
    return getComputedStyle(document.documentElement)
      .getPropertyValue(name).trim() || "currentColor";
  };

  /**
   * Row lookup by column NAME, never by index.
   *
   * daily-summary.tsv gains columns over time -- it went from 11 to 25 on
   * 2026-11-17 -- and rows written before a column existed are short. An
   * absent field is `null` here and prints as "—": it means the figure was
   * not measured, and must not be read, summed, or averaged as a zero.
   */
  function rowReader(header) {
    var idx = {};
    (header || []).forEach(function (name, i) { idx[name] = i; });
    return function (row, name) {
      var i = idx[name];
      if (i === undefined || !row || i >= row.length) { return null; }
      var t = (row[i] || "").trim();
      if (t === "") { return null; }
      var n = Number(t);
      return isFinite(n) ? n : null;
    };
  }

  /** The last `want` days ending at the newest row, with gaps made explicit. */
  function series(header, rows, column, want) {
    var get = rowReader(header);
    var dated = (rows || []).filter(function (r) {
      return r && /^\d{4}-\d{2}-\d{2}$/.test(r[0]);
    });
    if (!dated.length) { return []; }
    var byDay = {};
    dated.forEach(function (r) { byDay[r[0]] = r; });
    var last = dated[dated.length - 1][0];
    var out = [];
    var end = new Date(last + "T00:00:00Z");
    for (var i = want - 1; i >= 0; i--) {
      var d = new Date(end.getTime() - i * 86400000)
                .toISOString().slice(0, 10);
      var r = byDay[d];
      if (!r) {
        out.push({ day: d, value: null, state: "absent" });
        continue;
      }
      out.push({
        day: d,
        value: get(r, column),
        state: get(r, "day_partial") === 1 ? "partial" : "ok"
      });
    }
    return out;
  }

  function renderTraffic(s) {
    var L = s.logging || {};
    var W = L.window || null;
    var days = L.window_days || 7;
    var header = L.summary_header || [];
    var rows = L.summary_rows || [];
    var today = s.today || null;
    var live = s.live || null;

    // --- live counters ---
    var liveEl = document.getElementById("live");
    liveEl.textContent = "";
    if (live) {
      // The scope comes FIRST and names itself. It used to be a trailing
      // chip reading "live since 20:32", a wall clock that gave no span and
      // did not look like it governed the five counters to its left.
      var lead = document.createElement("span");
      lead.className = "c";
      var lb = document.createElement("b");
      lb.textContent = dur((Date.now() / 1000) - live.since);
      lead.appendChild(lb);
      lead.appendChild(document.createTextNode(" since the monitor restarted"));
      lead.title = "Monitor started " + clock(live.since) + ". These five "
                 + "counters cover only that span. The tiles below cover the "
                 + "last " + days + " UTC days, so the same "
                 + "metric reads differently in the two places.";
      liveEl.appendChild(lead);

      // Labels match the tile labels exactly, so a reader can see that the
      // live number and the tile number are the same metric over different
      // spans rather than two different quantities.
      [["rx", "heard", "rx_frames"],
       ["up", "gated to APRS-IS", "gated_up"],
       ["gated", "gated to RF", "gated_down"],
       ["drop", "not whitelisted", "is_dropped"],
       ["tx", "own tx", "tx_local"]].forEach(function (m) {
        var c = document.createElement("span");
        c.className = "c " + m[0];
        c.appendChild(document.createTextNode(m[1] + " "));
        var b = document.createElement("b");
        b.textContent = num(live[m[2]] || 0);
        c.appendChild(b);
        liveEl.appendChild(c);
      });
    }

    // --- the four tiles ---
    var tilesEl = document.getElementById("tiles");
    tilesEl.textContent = "";
    var note = [];

    function windowSub() {
      return W ? days + " UTC days to " + W.last : "";
    }

    // The sub-line's bolded half: how much of the window actually stands
    // behind the number above it. Blank when all of it does.
    function shortfall(countedField) {
      if (!W) { return ""; }
      var have = W[countedField];
      if (have === undefined || have === null) { return ""; }
      if (have < days) { return have + " of " + days + " days measured"; }
      if (W.days_partial) { return W.days_partial + " partial"; }
      return "";
    }

    tile(tilesEl, {
      label: "Packets heard",
      value: W ? num(W.rx_packets) : "—",
      hue: CSSVAR("--rx"),
      points: series(header, rows, "rx_packets", days),
      sub: windowSub(),
      warn: shortfall("rx_packets_days")
    });

    // The union, not the sum. Seven days of ~300 stations is not 2,100
    // distinct stations, and the bars below are per-day counts, so the big
    // number is deliberately smaller than they add up to.
    tile(tilesEl, {
      label: "Stations heard",
      value: W ? num(W.stations) : "—",
      hue: CSSVAR("--up"),
      points: series(header, rows, "rx_stations", days),
      sub: "distinct over " + days + " UTC days, a union",
      warn: W && W.stations_new ? ("+" + W.stations_new + " first-time") : ""
    });

    tile(tilesEl, {
      label: "Gated to APRS-IS",
      value: W ? num(W.day_gated_up) : "—",
      hue: CSSVAR("--gated"),
      points: series(header, rows, "day_gated_up", days),
      sub: windowSub(),
      warn: shortfall("day_gated_up_days")
    });

    tile(tilesEl, {
      label: "Gated to RF",
      value: W ? num(W.day_gated_down) : "—",
      hue: CSSVAR("--tx"),
      points: series(header, rows, "day_gated_down", days),
      // The span stays on the sub-line even when the offered count is
      // available. Without it this tile lost its window as soon as all
      // seven days were measured and `shortfall` fell silent, which is
      // the one tile where the window being invisible already caused a
      // misread against the live counter.
      sub: W && W.day_is_offered !== null && W.day_is_offered !== undefined
             ? windowSub() + ", of " + num(W.day_is_offered) + " offered"
             : windowSub(),
      warn: shortfall("day_gated_down_days")
    });

    // --- today so far, and the honest caveats ---
    if (today && today.present) {
      note.push("UTC day " + today.day + " so far: " + num(today.packets)
                + " heard from " + num(today.stations) + " stations, "
                + num(today.direct) + " copied direct.");
    } else if (today) {
      note.push("No dated log for the current UTC day yet.");
    }
    // Every date on this panel is a UTC day, because that is how direwolf
    // names the dated logs and the only reason rx_packets off the card and
    // day_rx_frames off the console log can be compared at all. Unlabeled it
    // reads as a fault: at 20:27 local on 2026-11-18 the panel showed
    // 2026-11-19 with a few hours of traffic under it.
    note.push("Dates here are UTC days, which is how the dated logs are "
              + "named. Through the local evening the UTC date reads one day "
              + "ahead and its counts are only a few hours old.");
    if (W) {
      if (W.days_present < days) {
        note.push("Only " + W.days_present + " of the last " + days
                  + " days have a summary row, so every total above is a sum "
                  + "over the days that do.");
      }
      if (W.days_partial) {
        note.push(W.days_partial + " of those days are flagged partial: the "
                  + "console log did not span the whole UTC day, usually a "
                  + "reboot, so the gated counts for them are an undercount. "
                  + "The heard counts come from the card and are unaffected.");
      }
      if (W.undated) {
        note.push(num(W.undated) + " log lines carried no timestamp and were "
                  + "counted toward no day.");
      }
    }
    note.push("Heard counts include this station's own beacons returning off "
              + "the air after a digipeater repeats them; those are broken "
              + "out as rx_own and excluded from the station counts.");
    var noteEl = document.getElementById("trafficnote");
    noteEl.textContent = "";
    note.forEach(function (t, i) {
      var p = document.createElement("div");
      if (i) { p.style.marginTop = ".25rem"; }
      p.textContent = t;
      noteEl.appendChild(p);
    });

    // --- headline beside the panel title ---
    if (today && today.present) {
      headline("trafficchip", "· " + num(today.packets) + " heard "
                              + today.day + " UTC");
    } else if (W) {
      headline("trafficchip", "· " + num(W.rx_packets) + " in "
                              + W.days_present + " days");
    } else {
      headline("trafficchip", "");
    }

    // --- the per-day table: exact columns only ---
    var dailyEl = document.getElementById("daily");
    dailyEl.textContent = "";
    if (!rows.length || !header.length) { return; }
    var WANT = [
      ["date", "day (UTC)"],
      ["rx_packets", "heard"],
      ["rx_direct", "direct"],
      ["rx_stations", "stns"],
      ["day_gated_up", "up"],
      ["day_gated_down", "down"],
      ["day_is_offered", "offered"],
      ["day_beacons", "beacons"],
      ["day_beacon_repeats", "repeats"],
      ["day_partial", "part"]
    ];
    var idx = {};
    header.forEach(function (name, i) { idx[name] = i; });
    var present = WANT.filter(function (c) { return idx[c[0]] !== undefined; });
    var table = document.createElement("table");
    var thead = document.createElement("tr");
    present.forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c[1];
      thead.appendChild(th);
    });
    table.appendChild(thead);

    // A day the station did not run has no row at all, and a table that
    // simply skips it hides an outage behind a date sequence nobody reads
    // closely. Fill the window's missing days in explicitly.
    var byDay = {};
    rows.forEach(function (r) { if (r && r[0]) { byDay[r[0]] = r; } });
    var ordered = [];
    if (W && W.last) {
      var end = new Date(W.last + "T00:00:00Z");
      for (var k = 0; k < days; k++) {
        var dstr = new Date(end.getTime() - k * 86400000)
                     .toISOString().slice(0, 10);
        ordered.push(byDay[dstr] || { missing: dstr });
      }
    } else {
      ordered = rows.slice().reverse();
    }

    ordered.forEach(function (r) {
      var tr = document.createElement("tr");
      if (r.missing) {
        var td0 = document.createElement("td");
        td0.textContent = r.missing;
        td0.className = "gap";
        tr.appendChild(td0);
        var rest = document.createElement("td");
        rest.colSpan = present.length - 1;
        rest.className = "gap";
        rest.style.textAlign = "left";
        // Short on purpose: this cell sits in a horizontally scrolling
        // container on a phone, and the note above the table already says
        // how many days of the window are missing and what that means.
        rest.textContent = "no summary row";
        tr.appendChild(rest);
        table.appendChild(tr);
        return;
      }
      present.forEach(function (c) {
        var td = document.createElement("td");
        var raw = r[idx[c[0]]];
        if (c[0] === "date") {
          td.textContent = raw === undefined ? "—" : raw;
        } else if (c[0] === "day_partial") {
          // A flag, not a count. "yes" earns the eye; blank is the quiet case.
          td.textContent = raw === "1" ? "yes" : (raw === "0" ? "" : "—");
          if (raw === "1") { td.className = "gap"; }
        } else {
          var t = (raw === undefined || raw === null) ? "" : String(raw).trim();
          td.textContent = t === "" ? "—" : num(t);
          if (t === "") { td.className = "gap"; }
        }
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    dailyEl.appendChild(table);
  }

  function kv(grid, label, value, cls) {
    var dl = document.createElement("dl");
    dl.className = "kv";
    var dt = document.createElement("dt");
    dt.textContent = label;
    var dd = document.createElement("dd");
    dd.textContent = value;
    if (cls) { dd.className = cls; }
    dl.appendChild(dt); dl.appendChild(dd); grid.appendChild(dl);
    return dd;
  }

  // The morning check, without an ssh session: is today's dated log filling,
  // did the timer fire, and is rotation outpacing the archiver.
  //
  // Traffic figures are NOT here any more. They are in renderTraffic, which
  // shows only columns that are exact for the UTC day they sit beside. This
  // panel is health only: units, timer, log sizes, chunk capture.
  //
  // The win_* columns are no longer rendered anywhere. They count whatever
  // the console log held when the archiver ran, and that span is not a
  // constant: it was 8 days at 48 beacons a day and 3.2 days at 720, so
  // win_gated read 316 on the 2026-11-17 row and 28 on 2026-11-18 with the
  // underlying rate steady at 6 a day. A rolling count over a window that
  // moves on its own does not belong beside exact per-day numbers, and
  // day_gated_down measures the same thing against a stated day. The
  // columns stay in the TSV so the historical series does not break.
  function renderLogging(L, today) {
    var grid = document.getElementById("logging");
    grid.textContent = "";
    if (!L || L.error) {
      kv(grid, "Status", L ? "unavailable" : "not reported");
      headline("logchip", "· unavailable");
      return;
    }

    var t = L.today || {};

    // One phrase beside the title, so the panel does not have to be opened to
    // know whether anything is wrong.
    if (!t.present) {
      headline("logchip", "· no log today");
    } else if (t.age_s !== null && t.age_s > 3600) {
      headline("logchip", "· stale " + since(t.age_s));
    } else {
      headline("logchip", "· " + bytes(t.bytes) + " today");
    }

    // The packet count comes from the incremental reader rather than from
    // _day_file's line count, which is skipped above 2 MB -- and a real day
    // here runs 1 to 2.3 MB, so the count used to disappear from the panel
    // partway through the busiest days.
    var rowText = "";
    if (today && today.present && today.packets !== null) {
      rowText = " · " + num(today.packets) + " packets";
    } else if (t.rows !== null && t.rows !== undefined) {
      rowText = " · " + num(t.rows) + " rows";
    }
    kv(grid, "Today (UTC)",
       t.present ? bytes(t.bytes) + rowText + " · written " + since(t.age_s)
                 : "not created yet",
       t.present ? "" : "mark");

    var y = L.yesterday || {};
    kv(grid, "Yesterday",
       y.present ? bytes(y.bytes) + (y.rows !== null ? " · " + num(y.rows) + " rows" : "")
                 : "absent",
       y.present ? "" : "mark");

    // "not installed" is a different problem from "installed and stopped",
    // and systemctl reports both as inactive without LoadState. A Docker
    // deployment has no timer at all and should not be nagged about one.
    var timer = L.timer || {};
    var tstate = timer.state || "unknown";
    kv(grid, "Archive timer",
       tstate + (timer.next ? " · next " + timer.next : ""),
       tstate === "active" ? "" : (tstate === "unknown" ? "" : "mark"));
    if (timer.last) { kv(grid, "Last run", timer.last); }

    kv(grid, "Archived chunks",
       L.chunks + (L.chunks_truncated ? "+ (scan limit)" : "")
       + " · " + bytes(L.chunk_bytes)
       + (L.newest_chunk_age_s !== null ? " · newest " + since(L.newest_chunk_age_s) : ""));

    // NOT marked on the generation count: logrotate keeps .1 and .2
    // permanently, so that number sits at 2 in normal operation and a warning
    // that is always on is one nobody reads. The real signal for "rotation is
    // outpacing the archiver" is chunks_saved going above 1 on a routine day,
    // marked in the table below.
    var gens = (L.rotations_held || []);
    kv(grid, "Live packet log",
       bytes(L.live_log_bytes) + " · " + gens.length + " rotated generation"
       + (gens.length === 1 ? "" : "s") + " held");

    // A stale newest chunk means the timer has not captured anything for over
    // a day, which IS worth the eye.
    if (L.newest_chunk_age_s !== null && L.newest_chunk_age_s > 93600) {
      kv(grid, "Archive", "no new chunk in " + since(L.newest_chunk_age_s),
         "mark");
    }

    var rows = L.summary_rows || [];
    var hdr = L.summary_header || [];
    if (!rows.length || !hdr.length) {
      kv(grid, "Daily summary", "no rows yet");
      return;
    }

    // chunks_saved is a per-day count and belongs with the health fields.
    // Above one means the log rotated twice between archiver runs; at two
    // generations kept, a third rotation inside a day loses one.
    var get = rowReader(hdr);
    var newest = rows[rows.length - 1];
    var chunks = get(newest, "chunks_saved");
    if (chunks !== null) {
      kv(grid, "Chunks captured (" + newest[0] + ")", String(chunks),
         chunks > 1 ? "mark" : "");
    }
  }

  function pollStatus() {
    fetch("/api/status", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(renderStatus)
      .catch(function () { chip("c-state", "unreachable", "bad"); });
  }
  pollStatus();
  setInterval(pollStatus, 15000);

  // --- log ----------------------------------------------------------------

  function labelClass(label) {
    return "l-" + label.toLowerCase().replace(/[^a-z]/g, "");
  }

  function append(node) {
    if (emptyEl && emptyEl.parentNode) { emptyEl.remove(); }
    logEl.appendChild(node);
    while (logEl.childNodes.length > MAX_ROWS) { logEl.removeChild(logEl.firstChild); }
    if (pinned) { logEl.scrollTop = logEl.scrollHeight; }
  }

  function addEvent(ev) {
    var row = document.createElement("div");
    row.className = "row";
    var t = document.createElement("span");
    t.className = "t"; t.textContent = ev.time;
    var l = document.createElement("span");
    l.className = "l " + labelClass(ev.label); l.textContent = ev.label;
    var m = document.createElement("span");
    m.className = "m"; m.textContent = ev.text;
    row.appendChild(t); row.appendChild(l); row.appendChild(m);
    append(row);
  }

  function addDetail(ev) {
    var d = document.createElement("div");
    d.className = "detail"; d.textContent = ev.text;
    append(d);
  }

  function addNote(ev) {
    var n = document.createElement("div");
    n.className = "note"; n.textContent = ev.text;
    append(n);
  }

  logEl.addEventListener("scroll", function () {
    var atEnd = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
    pinned = atEnd;
    jumpEl.classList.toggle("show", !atEnd);
  });

  jumpEl.addEventListener("click", function () {
    pinned = true;
    logEl.scrollTop = logEl.scrollHeight;
    jumpEl.classList.remove("show");
  });

  // EventSource reconnects by itself, which is the main reason for choosing SSE
  // over a WebSocket here.
  var es = new EventSource("/events");
  es.onopen = function () { chip("c-feed", "live", "live"); };
  es.onerror = function () { chip("c-feed", "reconnecting", "bad"); };
  es.onmessage = function (msg) {
    var ev;
    try { ev = JSON.parse(msg.data); } catch (e) { return; }
    if (ev.kind === "event") { addEvent(ev); }
    else if (ev.kind === "detail") { addDetail(ev); }
    else if (ev.kind === "note") { addNote(ev); }
  };
}());
</script>
</body>
</html>
