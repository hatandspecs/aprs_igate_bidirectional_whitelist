<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="Liberation Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7680"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>
  <rect width="1240" height="470" fill="#ffffff"/>

  <!-- ===== left: RF -> APRS-IS, wide open ===== -->
  <text x="285" y="26" text-anchor="middle" font-size="24" fill="#111111" font-weight="600">RF &#8594; the internet</text>
  <text x="285" y="48" text-anchor="middle" font-size="18" fill="#5b6770">everything it hears goes up</text>

  <rect x="40" y="66" width="490" height="62" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <text x="285" y="92" text-anchor="middle" font-size="21" fill="#111111">heard on 144.390</text>
  <text x="285" y="114" text-anchor="middle" font-size="17" fill="#5b6770">positions · telemetry · status · other people's messages</text>

  <path d="M285,132 V330" stroke="#111111" stroke-width="10" marker-end="url(#k)" fill="none"/>
  <text x="305" y="205" font-size="17" fill="#5b6770">no filter here —</text>
  <text x="305" y="227" font-size="17" fill="#5b6770">this is the useful</text>
  <text x="305" y="249" font-size="17" fill="#5b6770">half of an iGate</text>

  <rect x="40" y="344" width="490" height="62" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <text x="285" y="382" text-anchor="middle" font-size="21" fill="#111111">gated up to APRS-IS</text>

  <text x="285" y="438" text-anchor="middle" font-size="20" fill="#111111" font-weight="600">3,421 of 3,742 frames</text>
  <text x="285" y="460" text-anchor="middle" font-size="16" fill="#5b6770">the rest were duplicates or its own</text>

  <line x1="600" y1="20" x2="600" y2="450" stroke="#dde2e6" stroke-width="2"/>

  <!-- ===== right: APRS-IS -> RF, a gauntlet ===== -->
  <text x="915" y="26" text-anchor="middle" font-size="24" fill="#111111" font-weight="600">The internet &#8594; RF</text>
  <text x="915" y="48" text-anchor="middle" font-size="18" fill="#5b6770">almost nothing gets through</text>

  <rect x="660" y="66" width="370" height="50" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <text x="845" y="97" text-anchor="middle" font-size="20" fill="#111111">offered by the servers</text>

  <g font-size="19" fill="#111111">
    <rect x="660" y="140" width="370" height="46" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="845" y="169" text-anchor="middle">is it a message at all?</text>
    <rect x="660" y="212" width="370" height="46" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="845" y="241" text-anchor="middle">addressed to my whitelist?</text>
    <rect x="660" y="284" width="370" height="46" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="845" y="313" text-anchor="middle">under the rate cap?</text>
  </g>

  <g stroke="#111111" stroke-width="2.5" marker-end="url(#k)" fill="none">
    <line x1="845" y1="118" x2="845" y2="136"/>
    <line x1="845" y1="188" x2="845" y2="208"/>
    <line x1="845" y1="260" x2="845" y2="280"/>
    <line x1="845" y1="332" x2="845" y2="352"/>
  </g>

  <g stroke="#6b7680" stroke-width="2" marker-end="url(#d)" fill="none">
    <line x1="1032" y1="163" x2="1090" y2="163"/>
    <line x1="1032" y1="235" x2="1090" y2="235"/>
    <line x1="1032" y1="307" x2="1090" y2="307"/>
  </g>
  <rect x="1094" y="140" width="110" height="190" rx="6" fill="#f0f2f4" stroke="#c9d0d6" stroke-width="2"/>
  <text x="1149" y="228" text-anchor="middle" font-size="21" fill="#5b6770" font-weight="600">dropped</text>
  <text x="1149" y="252" text-anchor="middle" font-size="16" fill="#5b6770">never keyed</text>

  <rect x="660" y="356" width="370" height="50" rx="6" fill="#111111"/>
  <text x="845" y="387" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="600">TRANSMIT on 144.390</text>

  <text x="845" y="438" text-anchor="middle" font-size="20" fill="#111111" font-weight="600">8 of 10,151 packets</text>
  <text x="845" y="460" text-anchor="middle" font-size="16" fill="#5b6770">all eight addressed to me</text>
</svg>
