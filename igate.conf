# APRS iGate configuration — plain key = value, no shell syntax.
# Edit these values, then run:  ./deploy_igate.sh config   (review/validate)
#                                ./deploy_igate.sh up       (deploy)
# Background on each setting is in aprs-igate-prototype-test.md.

# --- Deployment mode ---
# docker (default): runs direwolf + rigctld in the locked-down container.
# bare-metal: installs direwolf/hamlib on this host and runs them directly,
# no container. See README.md ("Docker mode vs. bare-metal mode").
DEPLOY_MODE = docker

# --- Station identity (Section 7) ---
MYCALL = KD3CCO-10
MODEM = 1200

# --- Audio device (Section 5: `arecord -l`) ---
ACHANNELS = 1
ADEVICE = plughw:1,0

# --- Audio levels (ALSA mixer, re-applied on every `up`) ---
# These reset to device defaults whenever the radio's USB re-enumerates, and
# the defaults are WRONG in both directions: the default TX level over-
# deviates (signal is audible but undecodable) and the default capture gain
# is far too low to decode anything. Both fail silently, so `up` always
# re-applies these rather than trusting whatever survived.
#
# Calibrated 2026-09-07 against a Yaesu FTX-1 at 1 W: TX 10 produced a signal
# that W3YA-1 digipeated and KB3KPP-1 gated. TX 23 (the device default) and
# TX 33 both over-deviated and decoded nowhere.
TX_AUDIO_LEVEL = 10
RX_AUDIO_LEVEL = 35
DISABLE_AGC = yes

# --- Radio setup applied on every `up` (via CAT) ---
# Guards against the failure that cost hours during bring-up: in plain FM the
# FTX-1 modulates from the MIC input, not the USB codec, so Direwolf keys the
# radio and transmits a carrier with no data in it. PTT works, the waterfall
# shows a signal, and nothing anywhere can decode it. PKTFM is hamlib's name
# for the radio's FM-D (data FM) mode, verified: "M FM" -> FM, "M PKTFM" -> FM-D.
RADIO_SET_ON_UP = yes
RADIO_FREQ = 144390000
RADIO_MODE = PKTFM
RADIO_PASSBAND = 16000

# --- CAT / PTT (Section 8) ---
# The FTX-1 exposes CAT control and PTT as two separate serial ports over its
# single USB-C connection. Confirmed working via WSJT-X and the ftx1-tuner-sweep
# project: hamlib has no native FTX-1 model yet, but it CAT-controls cleanly
# as a Yaesu FT-991 (rigctl model 1035). See README.md for how this is wired.
RIG_MODEL = 1035          # hamlib model number; `rigctl --list` to find others
CAT_DEVICE = /dev/ttyUSB0 # CAT control port (frequency, mode, etc.)
CAT_BAUD = 38400
PTT_DEVICE = /dev/ttyACM0 # separate PTT port. Single-port radios: same as CAT_DEVICE
PTT_TYPE = RIG            # RIG = PTT via CAT command (hamlib's name for what
                           # WSJT-X calls the "CAT" PTT method). Other values:
                           # RTS, DTR, NONE — see README.md.

# --- APRS-IS server login ---
# See README.md ("APRS-IS and your passcode") for what this network is and
# how to get your passcode. Leave IGLOGIN_PASSCODE blank here — put the real
# value in igate.secrets (gitignored) or the IGATE_PASSCODE env var instead
# of committing it in this file.
IGSERVER = noam.aprs2.net
IGLOGIN_CALL = KD3CCO
IGLOGIN_PASSCODE =

# --- Strict whitelist (Section 4) ---
# Comma-separated calls. Only Internet->RF *messages* addressed to one of
# these will ever be transmitted — everything else (positions, telemetry,
# messages to anyone else) is silently dropped. Wildcard (*) covers all
# SSIDs of a call, so "KD3CCO*" matches KD3CCO, KD3CCO-7, KD3CCO-10, etc.
#
# One call:            WHITELIST_CALLS = KD3CCO*
# Multiple calls:       WHITELIST_CALLS = KD3CCO*, W3XYZ*, N0CALL-9
WHITELIST_CALLS = KD3CCO*

# --- Transmit path (Section 7/12) ---
# Bench (direct RF to witness station): 0
# Field (via W3YA-1 digipeater, which answers WIDE2 not WIDE1): 0 WIDE2-1
IGTXVIA = 0

# Rate cap: max N packets in M seconds
IGTXLIMIT = 6 10
