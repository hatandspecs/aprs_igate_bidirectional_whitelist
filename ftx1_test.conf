# Direwolf config for the FTX-1 frame-length tests (KD3CCO-9).
#
# This is NOT an iGate config. It deliberately has no IGSERVER: the station
# under test only transmits frames handed to it over KISS, and the receiving
# instruments are the Pi (KD3CCO-10) and the handheld (KD3CCO-7). Gating to
# APRS-IS from here would duplicate the Pi and put a second copy of every
# test frame into the dedupe window, which is exactly what made aprs.fi
# useless for reading relay paths in the first place.
#
# Audio is the FTX-1's own C-Media USB codec, host card 1. Passing /dev/snd
# into the container keeps ALSA's numbering the same inside and out.
#
# PTT goes through rigctld, which entrypoint.sh starts on 127.0.0.1:4532 with
# the FTX-1's separate CAT and PTT ports bridged (model 1051, CAT on
# /dev/ttyUSB0 at 38400, PTT on /dev/ttyACM0). Hamlib model 2 is NET rigctl,
# so Direwolf asks rigctld to key rather than holding a serial line itself.
# Model 1051 supersedes 1035: 1035 reads but cannot tune.

ADEVICE  ftx1left
ACHANNELS 1
CHANNEL 0

MYCALL   KD3CCO-9
MODEM    1200

PTT      RIG 2 127.0.0.1:4532

# ftx1_length_test.py connects here and hands over byte-exact AX.25 frames.
# Published to the host as 8001 by the docker run line in the runbook.
KISSPORT 8001

# Receive is left on deliberately. The laptop then becomes a third independent
# witness: it can hear W3YA-1 repeat KD3CCO-9 directly, without the APRS-IS
# dedupe that hides relayed copies from aprs.fi.

# Not used; 8000 is taken on this host and Direwolf warns about it.
AGWPORT 0

# 1200 baud at Direwolf's default 44100 is 36.75 samples per symbol, a
# non-integer, so every symbol boundary quantises to a different sample.
# 48000 gives exactly 40. It also matches the C-Media codec's native rate,
# which keeps ALSA's plug layer from resampling the transmit audio.
# Added 2026-11-26 to test whether that timing jitter is what W3YA-1's single
# hardware DPLL cannot track on long frames.
ARATE 48000
